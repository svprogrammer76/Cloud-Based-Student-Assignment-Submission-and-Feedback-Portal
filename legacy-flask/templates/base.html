<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Assignment Portal{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('home') }}">Cloud Assignment Portal</a>{% if current_user %}<span>{{ current_user.name }} · {{ current_user.role|title }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ session.get('csrf_token','') }}"><button class="link">Sign out</button></form>{% endif %}</header><main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% block body %}{% endblock %}</main><footer>Demo project · Use dummy data only</footer></body></html>
